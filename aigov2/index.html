<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Governance Center — Archive360</title>
<script>
  // Every stylesheet, data module and script is loaded with a per-load version stamp so a refresh always
  // picks up the latest files, whether the prototype is opened from disk or served over HTTP.
  (function () {
    var v = String(Date.now());
    var styles = ["css/v216-base.css", "css/app.css"];
    // Data modules: generated by tools/generate_data.py. All synthetic data lives in these files, never in this page.
    var data = ["data/meta.js", "data/platforms.js", "data/groups.js", "data/members.js", "data/profiles.js", "data/aisystems.js", "data/register.js",
      "data/rules.js", "data/interactions.js", "data/findings.js", "data/escalations.js", "data/audit.js", "data/notifications.js", "data/evidence.js",
      "data/unregistered.js", "data/mapping.js", "data/conversations-1.js", "data/conversations-2.js", "data/conversations-3.js", "data/conversations-4.js", "data/conversations-5.js", "data/conversations-6.js", "data/conversations-7.js"];
    // Application scripts, in dependency order.
    var app = ["js/util.js", "js/store.js", "js/router.js", "js/shell.js", "js/components.js", "js/pages/start.js", "js/pages/overview.js",
      "js/pages/groups.js", "js/pages/group.js", "js/pages/placeholder.js", "js/pages/settings.js", "js/pages/mapping.js", "js/pages/instances.js", "js/pages/bgroups.js", "js/pages/registry.js", "js/pages/evidence.js", "js/pages/unregistered.js", "js/pages/audit.js", "js/pages/people.js", "js/pages/asset.js", "js/pages/interactions.js", "js/pages/findings.js", "js/pages/approvals.js", "js/pages/rules.js", "js/pages/guide-content.js", "js/pages/guide.js", "js/app.js"];
    styles.forEach(function (f) { document.write('<link rel="stylesheet" href="' + f + '?v=' + v + '">'); });
    window.__AGC_SCRIPTS = data.concat(app).map(function (f) { return f + "?v=" + v; });
  })();
</script>
</head>
<body data-theme="light">
<div id="app"><div class="page-body" style="color:#6b7280">Loading the Brookhaven Financial dataset…</div></div>
<script>
  (function () { window.__AGC_SCRIPTS.forEach(function (src) { document.write('<script src="' + src + '"><\/script>'); }); })();
</script>
</body>
</html>
